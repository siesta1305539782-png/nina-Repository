<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="一个适合工作事项管理的网页版工作待办程序。">
    <title>工作待办程序</title>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --accent: #cc0000;
            --accent-dark: #a80000;
            --paper: #f5f7fa;
            --panel: #ffffff;
            --ink: #1f252b;
            --muted: #66707a;
            --line: #d9dee5;
            --line-strong: #b8c0cc;
            --green: #287a57;
            --amber: #9c6100;
            --blue: #2468a9;
            --shadow: 0 18px 42px rgba(31, 37, 43, 0.09);
        }

        html {
            min-height: 100%;
        }

        body {
            background: var(--paper);
            color: var(--ink);
            font-family: Inter, "Segoe UI", Arial, sans-serif;
            min-height: 100vh;
        }

        button,
        input,
        select,
        textarea {
            font: inherit;
        }

        button,
        a,
        input,
        select,
        textarea {
            -webkit-tap-highlight-color: transparent;
        }

        button {
            cursor: pointer;
        }

        button:focus-visible,
        a:focus-visible,
        input:focus-visible,
        select:focus-visible,
        textarea:focus-visible {
            outline: 3px solid rgba(204, 0, 0, 0.28);
            outline-offset: 2px;
        }

        .visually-hidden {
            clip: rect(0 0 0 0);
            clip-path: inset(50%);
            height: 1px;
            overflow: hidden;
            position: absolute;
            white-space: nowrap;
            width: 1px;
        }

        .app-header {
            background: #11161c;
            border-bottom: 1px solid #27313b;
            color: #fff;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .header-inner {
            align-items: center;
            display: flex;
            gap: 18px;
            justify-content: space-between;
            margin: 0 auto;
            max-width: 1200px;
            min-height: 68px;
            padding: 12px 22px;
        }

        .brand {
            align-items: center;
            color: #fff;
            display: inline-flex;
            gap: 12px;
            min-width: 0;
            text-decoration: none;
        }

        .brand-mark {
            align-items: center;
            background: var(--accent);
            border-radius: 6px;
            display: inline-flex;
            flex: 0 0 auto;
            height: 40px;
            justify-content: center;
            width: 40px;
        }

        .brand-text {
            display: grid;
            gap: 1px;
            min-width: 0;
        }

        .brand-title {
            font-size: 1.08rem;
            font-weight: 850;
            letter-spacing: 0;
            line-height: 1.15;
        }

        .brand-subtitle {
            color: #aab4bf;
            font-size: 0.76rem;
            font-weight: 700;
            line-height: 1.2;
        }

        .header-actions {
            align-items: center;
            display: flex;
            gap: 10px;
        }

        .date-chip {
            align-items: center;
            background: #1d252d;
            border: 1px solid #36424f;
            border-radius: 4px;
            color: #d7dee7;
            display: inline-flex;
            font-size: 0.84rem;
            font-weight: 700;
            gap: 8px;
            min-height: 38px;
            padding: 8px 12px;
            white-space: nowrap;
        }

        .home-link {
            align-items: center;
            border: 1px solid #3a4653;
            border-radius: 4px;
            color: #fff;
            display: inline-flex;
            font-size: 0.86rem;
            font-weight: 800;
            gap: 8px;
            min-height: 38px;
            padding: 8px 12px;
            text-decoration: none;
            transition: background-color 0.2s ease, border-color 0.2s ease;
        }

        .home-link:hover {
            background: #232d36;
            border-color: #667789;
        }

        .workspace {
            margin: 0 auto;
            max-width: 1200px;
            padding: 28px 22px 46px;
        }

        .summary-grid {
            display: grid;
            gap: 14px;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            margin-bottom: 18px;
        }

        .metric-tile {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px;
            box-shadow: 0 10px 28px rgba(31, 37, 43, 0.05);
            min-height: 104px;
            padding: 18px;
        }

        .metric-label {
            align-items: center;
            color: var(--muted);
            display: flex;
            font-size: 0.8rem;
            font-weight: 800;
            gap: 8px;
            margin-bottom: 10px;
        }

        .metric-value {
            color: var(--ink);
            font-size: 2rem;
            font-variant-numeric: tabular-nums;
            font-weight: 850;
            line-height: 1;
        }

        .metric-note {
            color: var(--muted);
            font-size: 0.78rem;
            font-weight: 650;
            margin-top: 8px;
        }

        .composer {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px;
            box-shadow: var(--shadow);
            margin-bottom: 18px;
            padding: 18px;
        }

        .composer-form {
            display: grid;
            gap: 12px;
            grid-template-columns: minmax(220px, 2fr) minmax(150px, 1fr) 150px 130px auto;
        }

        .control,
        .search-control {
            background: #fff;
            border: 1px solid var(--line-strong);
            border-radius: 5px;
            color: var(--ink);
            min-height: 44px;
            padding: 10px 12px;
            width: 100%;
        }

        .control::placeholder,
        .search-control::placeholder,
        textarea::placeholder {
            color: #8b96a3;
        }

        .primary-button,
        .secondary-button,
        .text-button {
            align-items: center;
            border-radius: 5px;
            display: inline-flex;
            font-size: 0.88rem;
            font-weight: 850;
            gap: 8px;
            justify-content: center;
            min-height: 44px;
            padding: 10px 14px;
            text-decoration: none;
            transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease, transform 0.2s ease;
            white-space: nowrap;
        }

        .primary-button {
            background: var(--accent);
            border: 1px solid var(--accent);
            color: #fff;
        }

        .primary-button:hover {
            background: var(--accent-dark);
            border-color: var(--accent-dark);
            transform: translateY(-1px);
        }

        .secondary-button {
            background: #fff;
            border: 1px solid var(--line-strong);
            color: var(--ink);
        }

        .secondary-button:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .text-button {
            background: transparent;
            border: 1px solid transparent;
            color: var(--muted);
        }

        .text-button:hover {
            color: var(--accent);
        }

        .tools-row {
            align-items: center;
            display: grid;
            gap: 12px;
            grid-template-columns: minmax(220px, 1fr) auto auto;
            margin-bottom: 18px;
        }

        .search-box {
            position: relative;
        }

        .search-box i {
            color: #7b8794;
            left: 13px;
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
        }

        .search-control {
            padding-left: 39px;
        }

        .segmented {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 6px;
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            padding: 4px;
        }

        .segmented button {
            background: transparent;
            border: 0;
            border-radius: 4px;
            color: var(--muted);
            font-size: 0.83rem;
            font-weight: 850;
            min-height: 36px;
            padding: 7px 10px;
            white-space: nowrap;
        }

        .segmented button:hover,
        .segmented button.active {
            background: #11161c;
            color: #fff;
        }

        .content-grid {
            align-items: start;
            display: grid;
            gap: 18px;
            grid-template-columns: minmax(0, 1fr) 330px;
        }

        .task-panel,
        .insight-panel {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(31, 37, 43, 0.06);
        }

        .panel-header {
            align-items: center;
            border-bottom: 1px solid var(--line);
            display: flex;
            gap: 12px;
            justify-content: space-between;
            min-height: 58px;
            padding: 14px 16px;
        }

        .panel-title {
            color: var(--ink);
            font-size: 0.96rem;
            font-weight: 850;
        }

        .panel-count {
            color: var(--muted);
            font-size: 0.78rem;
            font-weight: 800;
        }

        .task-list {
            display: grid;
            gap: 12px;
            padding: 14px;
        }

        .task-card {
            background: #fff;
            border: 1px solid var(--line);
            border-left: 5px solid var(--line-strong);
            border-radius: 7px;
            display: grid;
            gap: 13px;
            grid-template-columns: 38px minmax(0, 1fr) auto;
            min-height: 112px;
            padding: 14px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
        }

        .task-card:hover {
            border-color: var(--line-strong);
            box-shadow: 0 12px 28px rgba(31, 37, 43, 0.08);
            transform: translateY(-1px);
        }

        .task-card.priority-high {
            border-left-color: var(--accent);
        }

        .task-card.priority-medium {
            border-left-color: var(--amber);
        }

        .task-card.priority-low {
            border-left-color: var(--blue);
        }

        .task-card.status-done {
            background: #f7faf8;
        }

        .task-card.status-done .task-title {
            color: #6f7a84;
            text-decoration: line-through;
        }

        .toggle-button,
        .icon-button {
            align-items: center;
            background: #fff;
            border: 1px solid var(--line-strong);
            border-radius: 5px;
            color: var(--ink);
            display: inline-flex;
            height: 36px;
            justify-content: center;
            width: 36px;
        }

        .toggle-button:hover,
        .icon-button:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .task-card.status-done .toggle-button {
            background: var(--green);
            border-color: var(--green);
            color: #fff;
        }

        .task-main {
            min-width: 0;
        }

        .task-title {
            color: var(--ink);
            font-size: 1.02rem;
            font-weight: 850;
            line-height: 1.35;
            overflow-wrap: anywhere;
        }

        .task-note {
            color: var(--muted);
            font-size: 0.88rem;
            line-height: 1.55;
            margin-top: 8px;
            overflow-wrap: anywhere;
        }

        .task-badges,
        .task-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .task-badges {
            margin-top: 10px;
        }

        .task-meta {
            color: var(--muted);
            font-size: 0.78rem;
            font-weight: 700;
            margin-top: 11px;
        }

        .badge {
            align-items: center;
            border-radius: 999px;
            display: inline-flex;
            font-size: 0.74rem;
            font-weight: 850;
            gap: 6px;
            line-height: 1;
            min-height: 24px;
            padding: 6px 9px;
        }

        .badge.status-todo {
            background: #eef1f5;
            color: #45515e;
        }

        .badge.status-doing {
            background: #e8f2ff;
            color: var(--blue);
        }

        .badge.status-done {
            background: #e7f4ec;
            color: var(--green);
        }

        .badge.priority-high {
            background: #ffecec;
            color: var(--accent);
        }

        .badge.priority-medium {
            background: #fff4df;
            color: var(--amber);
        }

        .badge.priority-low {
            background: #eaf2fb;
            color: var(--blue);
        }

        .badge.due-overdue {
            background: #ffecec;
            color: var(--accent);
        }

        .badge.due-today {
            background: #fff4df;
            color: var(--amber);
        }

        .badge.due-clear {
            background: #eef1f5;
            color: var(--muted);
        }

        .task-actions {
            align-content: start;
            display: grid;
            gap: 8px;
            grid-auto-flow: column;
            grid-template-rows: repeat(2, 36px);
        }

        .delete-button:hover {
            border-color: var(--accent);
            background: #fff3f3;
            color: var(--accent);
        }

        .empty-state {
            align-items: center;
            color: var(--muted);
            display: grid;
            gap: 10px;
            min-height: 240px;
            place-items: center;
            padding: 42px 20px;
            text-align: center;
        }

        .empty-state i {
            color: #a7b0bb;
            font-size: 2.2rem;
        }

        .empty-state strong {
            color: var(--ink);
            display: block;
            font-size: 1rem;
        }

        .side-stack {
            display: grid;
            gap: 18px;
        }

        .insight-panel {
            overflow: hidden;
        }

        .insight-body {
            display: grid;
            gap: 12px;
            padding: 14px 16px 16px;
        }

        .focus-row,
        .project-row {
            align-items: center;
            border-bottom: 1px solid #edf0f3;
            display: grid;
            gap: 10px;
            grid-template-columns: minmax(0, 1fr) auto;
            min-height: 44px;
            padding: 6px 0 10px;
        }

        .focus-row:last-child,
        .project-row:last-child {
            border-bottom: 0;
            padding-bottom: 4px;
        }

        .focus-title,
        .project-name {
            font-size: 0.88rem;
            font-weight: 800;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .focus-date,
        .project-total {
            color: var(--muted);
            font-size: 0.76rem;
            font-weight: 750;
        }

        .progress-track {
            background: #edf0f3;
            border-radius: 999px;
            height: 9px;
            overflow: hidden;
            width: 100%;
        }

        .progress-fill {
            background: linear-gradient(90deg, var(--green), #42a87b);
            height: 100%;
            transition: width 0.25s ease;
            width: 0;
        }

        .progress-label {
            color: var(--muted);
            display: flex;
            font-size: 0.8rem;
            font-weight: 800;
            justify-content: space-between;
        }

        .modal {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px;
            box-shadow: 0 22px 70px rgba(17, 22, 28, 0.28);
            color: var(--ink);
            margin: auto;
            max-width: min(560px, calc(100vw - 28px));
            padding: 0;
            width: 560px;
        }

        .modal::backdrop {
            background: rgba(17, 22, 28, 0.5);
        }

        .modal-header {
            align-items: center;
            border-bottom: 1px solid var(--line);
            display: flex;
            justify-content: space-between;
            min-height: 58px;
            padding: 14px 16px;
        }

        .modal-title {
            font-size: 1rem;
            font-weight: 850;
        }

        .modal-form {
            display: grid;
            gap: 14px;
            padding: 16px;
        }

        .form-grid {
            display: grid;
            gap: 12px;
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .form-field {
            display: grid;
            gap: 7px;
        }

        .form-field.full {
            grid-column: 1 / -1;
        }

        .form-field label {
            color: var(--muted);
            font-size: 0.78rem;
            font-weight: 850;
        }

        textarea.control {
            min-height: 96px;
            resize: vertical;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        @media (max-width: 980px) {
            .summary-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .composer-form,
            .tools-row,
            .content-grid {
                grid-template-columns: 1fr;
            }

            .tools-row {
                align-items: stretch;
            }

            .segmented {
                justify-content: flex-start;
            }
        }

        @media (max-width: 620px) {
            .header-inner {
                align-items: flex-start;
                flex-direction: column;
            }

            .header-actions {
                flex-wrap: wrap;
                width: 100%;
            }

            .date-chip,
            .home-link {
                flex: 1 1 auto;
                justify-content: center;
            }

            .workspace {
                padding: 18px 14px 34px;
            }

            .summary-grid {
                grid-template-columns: 1fr;
            }

            .composer,
            .task-panel,
            .insight-panel,
            .metric-tile {
                border-radius: 6px;
            }

            .composer-form {
                gap: 10px;
            }

            .task-card {
                grid-template-columns: 36px minmax(0, 1fr);
                min-height: 0;
            }

            .task-actions {
                display: flex;
                flex-wrap: wrap;
                grid-column: 1 / -1;
                justify-content: flex-end;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .modal-actions {
                display: grid;
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header class="app-header">
        <div class="header-inner">
            <a class="brand" href="./" aria-label="工作待办程序首页">
                <span class="brand-mark"><i class="fas fa-list-check" aria-hidden="true"></i></span>
                <span class="brand-text">
                    <span class="brand-title">工作待办程序</span>
                    <span class="brand-subtitle">WORK TODO</span>
                </span>
            </a>
            <div class="header-actions">
                <span class="date-chip"><i class="far fa-calendar" aria-hidden="true"></i><span id="todayLabel">今天</span></span>
                <a class="home-link" href="../../index.html#projects"><i class="fas fa-arrow-left" aria-hidden="true"></i> 返回项目</a>
            </div>
        </div>
    </header>

    <main class="workspace">
        <section class="summary-grid" aria-label="待办概览">
            <div class="metric-tile">
                <span class="metric-label"><i class="fas fa-layer-group" aria-hidden="true"></i> 全部事项</span>
                <strong class="metric-value" id="totalCount">0</strong>
                <p class="metric-note">保存在当前浏览器</p>
            </div>
            <div class="metric-tile">
                <span class="metric-label"><i class="fas fa-spinner" aria-hidden="true"></i> 进行中</span>
                <strong class="metric-value" id="activeCount">0</strong>
                <p class="metric-note">未完成工作量</p>
            </div>
            <div class="metric-tile">
                <span class="metric-label"><i class="fas fa-calendar-day" aria-hidden="true"></i> 今日到期</span>
                <strong class="metric-value" id="todayCount">0</strong>
                <p class="metric-note">需要优先处理</p>
            </div>
            <div class="metric-tile">
                <span class="metric-label"><i class="fas fa-circle-check" aria-hidden="true"></i> 已完成</span>
                <strong class="metric-value" id="doneCount">0</strong>
                <p class="metric-note" id="doneRate">完成率 0%</p>
            </div>
        </section>

        <section class="composer" aria-label="新增待办">
            <form class="composer-form" id="taskForm">
                <label class="visually-hidden" for="taskTitle">事项</label>
                <input class="control" id="taskTitle" name="title" type="text" maxlength="80" placeholder="输入工作事项" autocomplete="off" required>

                <label class="visually-hidden" for="taskProject">项目</label>
                <input class="control" id="taskProject" name="project" type="text" maxlength="32" placeholder="所属项目" autocomplete="off">

                <label class="visually-hidden" for="taskDue">期限</label>
                <input class="control" id="taskDue" name="due" type="date">

                <label class="visually-hidden" for="taskPriority">优先级</label>
                <select class="control" id="taskPriority" name="priority">
                    <option value="medium">中优先级</option>
                    <option value="high">高优先级</option>
                    <option value="low">低优先级</option>
                </select>

                <button class="primary-button" type="submit"><i class="fas fa-plus" aria-hidden="true"></i> 新增</button>
            </form>
        </section>

        <section class="tools-row" aria-label="筛选待办">
            <div class="search-box">
                <i class="fas fa-magnifying-glass" aria-hidden="true"></i>
                <label class="visually-hidden" for="searchInput">搜索</label>
                <input class="search-control" id="searchInput" type="search" placeholder="搜索事项或项目">
            </div>

            <div class="segmented" id="filterGroup" role="group" aria-label="状态筛选">
                <button class="active" type="button" data-filter="all">全部</button>
                <button type="button" data-filter="todo">待处理</button>
                <button type="button" data-filter="doing">进行中</button>
                <button type="button" data-filter="today">今日</button>
                <button type="button" data-filter="overdue">逾期</button>
                <button type="button" data-filter="done">完成</button>
            </div>

            <label class="visually-hidden" for="sortSelect">排序</label>
            <select class="control" id="sortSelect">
                <option value="due">按期限排序</option>
                <option value="priority">按优先级排序</option>
                <option value="created">按创建时间排序</option>
            </select>
        </section>

        <section class="content-grid">
            <div class="task-panel">
                <div class="panel-header">
                    <div>
                        <h1 class="panel-title">工作清单</h1>
                        <span class="panel-count" id="visibleCount">0 项</span>
                    </div>
                    <button class="secondary-button" id="clearDoneButton" type="button"><i class="fas fa-broom" aria-hidden="true"></i> 清空完成</button>
                </div>
                <div class="task-list" id="taskList"></div>
            </div>

            <aside class="side-stack" aria-label="待办分析">
                <div class="insight-panel">
                    <div class="panel-header">
                        <h2 class="panel-title">完成进度</h2>
                        <span class="panel-count" id="progressValue">0%</span>
                    </div>
                    <div class="insight-body">
                        <div class="progress-track" aria-hidden="true">
                            <div class="progress-fill" id="progressFill"></div>
                        </div>
                        <div class="progress-label">
                            <span>已完成</span>
                            <span id="progressLabel">0 / 0</span>
                        </div>
                    </div>
                </div>

                <div class="insight-panel">
                    <div class="panel-header">
                        <h2 class="panel-title">今日焦点</h2>
                        <span class="panel-count" id="focusCount">0 项</span>
                    </div>
                    <div class="insight-body" id="focusList"></div>
                </div>

                <div class="insight-panel">
                    <div class="panel-header">
                        <h2 class="panel-title">项目分布</h2>
                        <span class="panel-count" id="projectCount">0 个</span>
                    </div>
                    <div class="insight-body" id="projectList"></div>
                </div>
            </aside>
        </section>
    </main>

    <dialog class="modal" id="taskDialog">
        <div class="modal-header">
            <h2 class="modal-title">编辑事项</h2>
            <button class="icon-button" id="closeDialogButton" type="button" aria-label="关闭"><i class="fas fa-xmark" aria-hidden="true"></i></button>
        </div>
        <form class="modal-form" id="editForm">
            <input id="editId" type="hidden">
            <div class="form-grid">
                <div class="form-field full">
                    <label for="editTitle">事项</label>
                    <input class="control" id="editTitle" type="text" maxlength="80" required>
                </div>
                <div class="form-field">
                    <label for="editProject">项目</label>
                    <input class="control" id="editProject" type="text" maxlength="32">
                </div>
                <div class="form-field">
                    <label for="editDue">期限</label>
                    <input class="control" id="editDue" type="date">
                </div>
                <div class="form-field">
                    <label for="editPriority">优先级</label>
                    <select class="control" id="editPriority">
                        <option value="high">高优先级</option>
                        <option value="medium">中优先级</option>
                        <option value="low">低优先级</option>
                    </select>
                </div>
                <div class="form-field">
                    <label for="editStatus">状态</label>
                    <select class="control" id="editStatus">
                        <option value="todo">待处理</option>
                        <option value="doing">进行中</option>
                        <option value="done">已完成</option>
                    </select>
                </div>
                <div class="form-field full">
                    <label for="editNote">备注</label>
                    <textarea class="control" id="editNote" maxlength="180" placeholder="补充负责人、会议结论或下一步"></textarea>
                </div>
            </div>
            <div class="modal-actions">
                <button class="secondary-button" id="cancelEditButton" type="button">取消</button>
                <button class="primary-button" type="submit"><i class="fas fa-floppy-disk" aria-hidden="true"></i> 保存</button>
            </div>
        </form>
    </dialog>

    <script>
        const storageKey = "project2-todo.tasks.v1";
        const priorityLabels = {
            high: "高优先级",
            medium: "中优先级",
            low: "低优先级"
        };
        const statusLabels = {
            todo: "待处理",
            doing: "进行中",
            done: "已完成"
        };
        const priorityRank = {
            high: 3,
            medium: 2,
            low: 1
        };

        const elements = {
            todayLabel: document.getElementById("todayLabel"),
            taskForm: document.getElementById("taskForm"),
            taskTitle: document.getElementById("taskTitle"),
            taskProject: document.getElementById("taskProject"),
            taskDue: document.getElementById("taskDue"),
            taskPriority: document.getElementById("taskPriority"),
            searchInput: document.getElementById("searchInput"),
            sortSelect: document.getElementById("sortSelect"),
            filterGroup: document.getElementById("filterGroup"),
            taskList: document.getElementById("taskList"),
            visibleCount: document.getElementById("visibleCount"),
            clearDoneButton: document.getElementById("clearDoneButton"),
            totalCount: document.getElementById("totalCount"),
            activeCount: document.getElementById("activeCount"),
            todayCount: document.getElementById("todayCount"),
            doneCount: document.getElementById("doneCount"),
            doneRate: document.getElementById("doneRate"),
            progressValue: document.getElementById("progressValue"),
            progressFill: document.getElementById("progressFill"),
            progressLabel: document.getElementById("progressLabel"),
            focusCount: document.getElementById("focusCount"),
            focusList: document.getElementById("focusList"),
            projectCount: document.getElementById("projectCount"),
            projectList: document.getElementById("projectList"),
            taskDialog: document.getElementById("taskDialog"),
            editForm: document.getElementById("editForm"),
            editId: document.getElementById("editId"),
            editTitle: document.getElementById("editTitle"),
            editProject: document.getElementById("editProject"),
            editDue: document.getElementById("editDue"),
            editPriority: document.getElementById("editPriority"),
            editStatus: document.getElementById("editStatus"),
            editNote: document.getElementById("editNote"),
            closeDialogButton: document.getElementById("closeDialogButton"),
            cancelEditButton: document.getElementById("cancelEditButton")
        };

        let tasks = loadTasks();
        let activeFilter = "all";

        elements.todayLabel.textContent = new Intl.DateTimeFormat("zh-CN", {
            month: "long",
            day: "numeric",
            weekday: "long"
        }).format(new Date());

        render();

        elements.taskForm.addEventListener("submit", (event) => {
            event.preventDefault();
            const title = elements.taskTitle.value.trim();

            if (!title) {
                elements.taskTitle.focus();
                return;
            }

            tasks.unshift({
                id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()),
                title,
                project: elements.taskProject.value.trim() || "工作事项",
                due: elements.taskDue.value,
                priority: elements.taskPriority.value,
                status: "todo",
                note: "",
                createdAt: new Date().toISOString()
            });

            elements.taskForm.reset();
            elements.taskPriority.value = "medium";
            elements.taskTitle.focus();
            persist();
            render();
        });

        elements.searchInput.addEventListener("input", render);
        elements.sortSelect.addEventListener("change", render);

        elements.filterGroup.addEventListener("click", (event) => {
            const button = event.target.closest("button[data-filter]");
            if (!button) {
                return;
            }

            activeFilter = button.dataset.filter;
            elements.filterGroup.querySelectorAll("button").forEach((item) => {
                item.classList.toggle("active", item === button);
            });
            render();
        });

        elements.taskList.addEventListener("click", (event) => {
            const button = event.target.closest("button[data-action]");
            if (!button) {
                return;
            }

            const task = tasks.find((item) => item.id === button.dataset.id);
            if (!task) {
                return;
            }

            const action = button.dataset.action;

            if (action === "complete") {
                task.status = task.status === "done" ? "todo" : "done";
            }

            if (action === "start") {
                task.status = task.status === "doing" ? "todo" : "doing";
            }

            if (action === "edit") {
                openEditor(task);
                return;
            }

            if (action === "delete") {
                tasks = tasks.filter((item) => item.id !== task.id);
            }

            persist();
            render();
        });

        elements.clearDoneButton.addEventListener("click", () => {
            const doneTotal = tasks.filter((task) => task.status === "done").length;
            if (doneTotal === 0) {
                return;
            }

            if (confirm(`删除 ${doneTotal} 个已完成事项？`)) {
                tasks = tasks.filter((task) => task.status !== "done");
                persist();
                render();
            }
        });

        elements.editForm.addEventListener("submit", (event) => {
            event.preventDefault();
            const task = tasks.find((item) => item.id === elements.editId.value);
            if (!task) {
                closeEditor();
                return;
            }

            task.title = elements.editTitle.value.trim();
            task.project = elements.editProject.value.trim() || "工作事项";
            task.due = elements.editDue.value;
            task.priority = elements.editPriority.value;
            task.status = elements.editStatus.value;
            task.note = elements.editNote.value.trim();

            persist();
            closeEditor();
            render();
        });

        elements.closeDialogButton.addEventListener("click", closeEditor);
        elements.cancelEditButton.addEventListener("click", closeEditor);

        function loadTasks() {
            try {
                const saved = JSON.parse(localStorage.getItem(storageKey));
                if (Array.isArray(saved)) {
                    return saved;
                }
            } catch (error) {
                localStorage.removeItem(storageKey);
            }

            const today = getTodayISO();
            const tomorrow = offsetDateISO(1);
            return [
                {
                    id: "seed-1",
                    title: "整理本周工作计划",
                    project: "周计划",
                    due: today,
                    priority: "high",
                    status: "doing",
                    note: "先确认优先级，再安排时间块。",
                    createdAt: new Date().toISOString()
                },
                {
                    id: "seed-2",
                    title: "跟进客户反馈",
                    project: "客户沟通",
                    due: tomorrow,
                    priority: "medium",
                    status: "todo",
                    note: "",
                    createdAt: new Date(Date.now() - 3600000).toISOString()
                },
                {
                    id: "seed-3",
                    title: "归档已完成资料",
                    project: "项目收尾",
                    due: "",
                    priority: "low",
                    status: "done",
                    note: "",
                    createdAt: new Date(Date.now() - 7200000).toISOString()
                }
            ];
        }

        function persist() {
            localStorage.setItem(storageKey, JSON.stringify(tasks));
        }

        function render() {
            const visibleTasks = getVisibleTasks();
            renderStats();
            renderTaskList(visibleTasks);
            renderInsights();
        }

        function getVisibleTasks() {
            const query = elements.searchInput.value.trim().toLowerCase();
            const filtered = tasks.filter((task) => {
                const matchesQuery = !query ||
                    task.title.toLowerCase().includes(query) ||
                    task.project.toLowerCase().includes(query) ||
                    (task.note || "").toLowerCase().includes(query);

                if (!matchesQuery) {
                    return false;
                }

                if (activeFilter === "today") {
                    return task.status !== "done" && task.due === getTodayISO();
                }

                if (activeFilter === "overdue") {
                    return isOverdue(task);
                }

                if (activeFilter === "all") {
                    return true;
                }

                return task.status === activeFilter;
            });

            return filtered.sort((first, second) => compareTasks(first, second));
        }

        function compareTasks(first, second) {
            if (elements.sortSelect.value === "priority") {
                return priorityRank[second.priority] - priorityRank[first.priority] || compareDue(first, second);
            }

            if (elements.sortSelect.value === "created") {
                return new Date(second.createdAt) - new Date(first.createdAt);
            }

            return compareDue(first, second) || priorityRank[second.priority] - priorityRank[first.priority];
        }

        function compareDue(first, second) {
            const a = first.due || "9999-12-31";
            const b = second.due || "9999-12-31";
            return a.localeCompare(b);
        }

        function renderStats() {
            const total = tasks.length;
            const done = tasks.filter((task) => task.status === "done").length;
            const active = total - done;
            const today = tasks.filter((task) => task.status !== "done" && task.due === getTodayISO()).length;
            const progress = total === 0 ? 0 : Math.round((done / total) * 100);

            elements.totalCount.textContent = total;
            elements.activeCount.textContent = active;
            elements.todayCount.textContent = today;
            elements.doneCount.textContent = done;
            elements.doneRate.textContent = `完成率 ${progress}%`;
            elements.progressValue.textContent = `${progress}%`;
            elements.progressFill.style.width = `${progress}%`;
            elements.progressLabel.textContent = `${done} / ${total}`;
            elements.clearDoneButton.disabled = done === 0;
        }

        function renderTaskList(visibleTasks) {
            elements.taskList.innerHTML = "";
            elements.visibleCount.textContent = `${visibleTasks.length} 项`;

            if (visibleTasks.length === 0) {
                const empty = document.createElement("div");
                empty.className = "empty-state";
                empty.innerHTML = '<i class="far fa-clipboard" aria-hidden="true"></i><div><strong>没有匹配事项</strong><span>换一个筛选条件或新增工作事项</span></div>';
                elements.taskList.appendChild(empty);
                return;
            }

            visibleTasks.forEach((task) => {
                elements.taskList.appendChild(createTaskCard(task));
            });
        }

        function createTaskCard(task) {
            const card = document.createElement("article");
            card.className = `task-card priority-${task.priority} status-${task.status}`;

            const toggle = document.createElement("button");
            toggle.className = "toggle-button";
            toggle.type = "button";
            toggle.dataset.action = "complete";
            toggle.dataset.id = task.id;
            toggle.setAttribute("aria-label", task.status === "done" ? "标记为待处理" : "标记为已完成");
            toggle.title = task.status === "done" ? "标记为待处理" : "标记为已完成";
            toggle.innerHTML = task.status === "done"
                ? '<i class="fas fa-check" aria-hidden="true"></i>'
                : '<i class="far fa-circle" aria-hidden="true"></i>';

            const main = document.createElement("div");
            main.className = "task-main";

            const title = document.createElement("h2");
            title.className = "task-title";
            title.textContent = task.title;
            main.appendChild(title);

            if (task.note) {
                const note = document.createElement("p");
                note.className = "task-note";
                note.textContent = task.note;
                main.appendChild(note);
            }

            const badges = document.createElement("div");
            badges.className = "task-badges";
            badges.append(
                createBadge(`status-${task.status}`, "fa-circle", statusLabels[task.status]),
                createBadge(`priority-${task.priority}`, "fa-flag", priorityLabels[task.priority]),
                createBadge(getDueTone(task), "fa-calendar", formatDue(task))
            );
            main.appendChild(badges);

            const meta = document.createElement("div");
            meta.className = "task-meta";
            const project = document.createElement("span");
            project.textContent = `项目：${task.project}`;
            const created = document.createElement("span");
            created.textContent = `创建：${formatShortDate(task.createdAt.slice(0, 10))}`;
            meta.append(project, created);
            main.appendChild(meta);

            const actions = document.createElement("div");
            actions.className = "task-actions";
            actions.append(
                createActionButton(task, "start", task.status === "doing" ? "fa-pause" : "fa-play", task.status === "doing" ? "设为待处理" : "设为进行中"),
                createActionButton(task, "edit", "fa-pen", "编辑"),
                createActionButton(task, "delete", "fa-trash", "删除", "delete-button")
            );

            card.append(toggle, main, actions);
            return card;
        }

        function createBadge(tone, icon, label) {
            const badge = document.createElement("span");
            badge.className = `badge ${tone}`;
            badge.innerHTML = `<i class="fas ${icon}" aria-hidden="true"></i>`;
            badge.append(document.createTextNode(label));
            return badge;
        }

        function createActionButton(task, action, icon, label, extraClass = "") {
            const button = document.createElement("button");
            button.className = `icon-button ${extraClass}`.trim();
            button.type = "button";
            button.dataset.action = action;
            button.dataset.id = task.id;
            button.title = label;
            button.setAttribute("aria-label", label);
            button.innerHTML = `<i class="fas ${icon}" aria-hidden="true"></i>`;
            return button;
        }

        function renderInsights() {
            const urgent = tasks
                .filter((task) => task.status !== "done" && task.due)
                .sort((first, second) => compareDue(first, second) || priorityRank[second.priority] - priorityRank[first.priority])
                .slice(0, 5);

            elements.focusList.innerHTML = "";
            elements.focusCount.textContent = `${urgent.length} 项`;

            if (urgent.length === 0) {
                elements.focusList.appendChild(createSimpleEmpty("暂无到期事项"));
            } else {
                urgent.forEach((task) => {
                    const row = document.createElement("div");
                    row.className = "focus-row";
                    const text = document.createElement("div");
                    const title = document.createElement("div");
                    title.className = "focus-title";
                    title.textContent = task.title;
                    const date = document.createElement("div");
                    date.className = "focus-date";
                    date.textContent = `${task.project} · ${formatDue(task)}`;
                    text.append(title, date);
                    row.append(text, createBadge(getDueTone(task), "fa-clock", priorityLabels[task.priority]));
                    elements.focusList.appendChild(row);
                });
            }

            const projects = Array.from(tasks.reduce((map, task) => {
                const name = task.project || "工作事项";
                const current = map.get(name) || { total: 0, open: 0 };
                current.total += 1;
                current.open += task.status === "done" ? 0 : 1;
                map.set(name, current);
                return map;
            }, new Map()).entries()).sort((a, b) => b[1].open - a[1].open || b[1].total - a[1].total);

            elements.projectList.innerHTML = "";
            elements.projectCount.textContent = `${projects.length} 个`;

            if (projects.length === 0) {
                elements.projectList.appendChild(createSimpleEmpty("暂无项目"));
                return;
            }

            projects.slice(0, 6).forEach(([name, stats]) => {
                const row = document.createElement("div");
                row.className = "project-row";
                const text = document.createElement("div");
                const projectName = document.createElement("div");
                projectName.className = "project-name";
                projectName.textContent = name;
                const projectTotal = document.createElement("div");
                projectTotal.className = "project-total";
                projectTotal.textContent = `未完成 ${stats.open} · 总计 ${stats.total}`;
                text.append(projectName, projectTotal);
                row.append(text, createBadge(stats.open ? "status-doing" : "status-done", "fa-folder", `${stats.open}`));
                elements.projectList.appendChild(row);
            });
        }

        function createSimpleEmpty(text) {
            const empty = document.createElement("p");
            empty.className = "focus-date";
            empty.textContent = text;
            return empty;
        }

        function openEditor(task) {
            elements.editId.value = task.id;
            elements.editTitle.value = task.title;
            elements.editProject.value = task.project;
            elements.editDue.value = task.due;
            elements.editPriority.value = task.priority;
            elements.editStatus.value = task.status;
            elements.editNote.value = task.note || "";

            if (typeof elements.taskDialog.showModal === "function") {
                elements.taskDialog.showModal();
            } else {
                elements.taskDialog.setAttribute("open", "");
            }

            elements.editTitle.focus();
        }

        function closeEditor() {
            if (elements.taskDialog.open) {
                elements.taskDialog.close();
            }
        }

        function formatDue(task) {
            if (!task.due) {
                return "未设期限";
            }

            if (task.status !== "done" && task.due === getTodayISO()) {
                return "今天到期";
            }

            if (isOverdue(task)) {
                return `逾期 ${Math.abs(getDayDiff(task.due))} 天`;
            }

            const diff = getDayDiff(task.due);
            if (diff > 0 && diff <= 7) {
                return `${diff} 天后`;
            }

            return formatShortDate(task.due);
        }

        function getDueTone(task) {
            if (!task.due || task.status === "done") {
                return "due-clear";
            }

            if (isOverdue(task)) {
                return "due-overdue";
            }

            if (task.due === getTodayISO()) {
                return "due-today";
            }

            return "due-clear";
        }

        function isOverdue(task) {
            return Boolean(task.due && task.status !== "done" && task.due < getTodayISO());
        }

        function getDayDiff(isoDate) {
            const target = new Date(`${isoDate}T00:00:00`);
            const today = new Date(`${getTodayISO()}T00:00:00`);
            return Math.round((target - today) / 86400000);
        }

        function getTodayISO() {
            const now = new Date();
            const offset = now.getTimezoneOffset() * 60000;
            return new Date(now - offset).toISOString().slice(0, 10);
        }

        function offsetDateISO(days) {
            const date = new Date(`${getTodayISO()}T00:00:00`);
            date.setDate(date.getDate() + days);
            return date.toISOString().slice(0, 10);
        }

        function formatShortDate(isoDate) {
            if (!isoDate) {
                return "未设置";
            }

            return new Intl.DateTimeFormat("zh-CN", {
                month: "short",
                day: "numeric"
            }).format(new Date(`${isoDate}T00:00:00`));
        }
    </script>
</body>
</html>
